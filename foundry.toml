[profile.default]
libs = ["dependencies"]
remappings = [
  # @openzeppelin packages use their own @openzeppelin/contracts(-upgradeable) imports internally.
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
  "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.6.1/",
]


# See more config options https://github.com/foundry-rs/foundry/tree/master/config

solc = "0.8.25"
optimizer = true
optimizer_runs = 100000

# pre push0 for maximum compatibility
evm_version = "cancun"


bytecode_hash = "none"
cbor_metadata = false

fs_permissions = [{ access = "read-write", path = "./src/generated"}]

[rpc_endpoints]
arbitrum = "${ARBITRUM_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
flare = "${FLARE_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"

[etherscan]
arbitrum = { key = "${CI_DEPLOY_ARBITRUM_ETHERSCAN_API_KEY}" }
base = { key = "${CI_DEPLOY_BASE_ETHERSCAN_API_KEY}" }
base_sepolia = { key = "${CI_DEPLOY_BASE_SEPOLIA_ETHERSCAN_API_KEY}" }
flare = { key = "${CI_DEPLOY_FLARE_ETHERSCAN_API_KEY}" }
polygon = { key = "${CI_DEPLOY_POLYGON_ETHERSCAN_API_KEY}" }

[dependencies]
"rainlang-interface" = "0.2.8"
forge-std = "1.16.2"
"@openzeppelin-contracts" = "5.6.1"
"@openzeppelin-contracts-upgradeable" = "5.6.1"
"rainlang" = "0.2.1"
"rain-verify-interface" = "0.1.0"
"rain-factory" = "0.1.1"
"rain-deploy" = "0.1.7"
"rain-metadata" = "0.1.0"
"rain-sol-codegen" = "0.1.36"
"rain-math-float" = "0.1.1"
"rain-lib-typecast" = "0.1.0"
"rain-extrospection" = "0.1.14"
"rain-intorastring" = "0.1.0"
"rain-lib-hash" = "0.1.0"
"rain-lib-memkv" = "0.1.0"
"rain-math-binary" = "0.1.4"
"rain-solmem" = "0.1.28"
"rain-string" = "0.2.0"
"rain-tofu-erc20-decimals" = "0.1.1"

[soldeer]
recursive_deps = false
